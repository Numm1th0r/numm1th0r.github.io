<!DOCTYPE html>
<html lang="hu" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Moll könyv</title>
<style>
  :root{
    --bg:#0f1115; --page:#171a21; --panel:#171a21; --panel-2:#1f232c;
    --ink:#e8eaf0; --muted:#9aa3b2; --chord:#6ea8ff; --accent:#3b82f6; --line:#2a2f3a;
    --song-font:16px;
  }
  html[data-theme="light"]{
    --bg:#e7e9ee; --page:#ffffff; --panel:#ffffff; --panel-2:#f4f6f9;
    --ink:#1b1f27; --muted:#6b7280; --chord:#1d4ed8; --accent:#1d4ed8; --line:#d8dce3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; overflow:hidden; }
  body{ display:flex; flex-direction:column; height:100dvh; }

  /* ---------- toolbar ---------- */
  .toolbar{
    flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 10px;
  }
  .group{ display:flex; align-items:center; gap:6px; }
  .grow{ flex:1 1 auto; min-width:120px; }
  select,button,input[type="text"]{
    font-size:15px; color:var(--ink); background:var(--panel-2);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
  }
  select{ -webkit-appearance:none; appearance:none; }
  #songSelect{ width:100%; }
  button{ cursor:pointer; min-width:38px; height:38px; line-height:1; }
  button:hover{ filter:brightness(1.08); }
  button:active{ transform:translateY(1px); }
  button.icon{ font-size:17px; padding:8px; }
  .sep{ width:1px; height:26px; background:var(--line); margin:0 2px; }
  .label{ font-size:12px; color:var(--muted); white-space:nowrap; }
  .key-val{ font-weight:800; min-width:44px; text-align:center; display:inline-block; }
  input[type="file"]{ display:none; }

  /* ---------- viewer ---------- */
  .viewer{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; }

  /* mobile / narrow: reflowed flow */
  .viewer.mode-flow{ overflow-x:hidden; padding:12px 12px 45vh; }
  .mode-flow .song-head{
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
    border-bottom:2px solid var(--line); padding-bottom:8px; margin-bottom:10px;
  }

  /* desktop / wide: one A4 page per song, scaled to fit */
  .viewer.mode-page{ display:flex; justify-content:center; align-items:flex-start;
    padding:18px; background:var(--bg); overflow:auto; }
  .page-wrap{ position:relative; }
  .page{
    position:absolute; top:0; left:0; transform-origin:top left;
    width:210mm; height:297mm; background:var(--page); color:var(--ink);
    box-shadow:0 4px 22px rgba(0,0,0,.35); padding:14mm 14mm 12mm;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .page-title-row{
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
    border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:6px;
  }
  .song-content{ flex:1 1 auto; position:relative; overflow:hidden; }

  .song-title{ font-size:22px; font-weight:800; margin:0; }
  .song-capo{ font-size:13px; color:var(--muted); font-style:italic; }

  .song-inner{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    font-size:var(--song-font); line-height:1.34;
  }
  .mode-page .song-inner{ transform-origin:top left; }
  .stanza{ margin-bottom:12px; break-inside:avoid; }
  .section-header{
    font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); font-size:.8em; margin:9px 0 3px;
  }
  .line{ white-space:pre; }
  .line.chord{ color:var(--chord); font-weight:700; }
  .line.lyric{ color:var(--ink); }

  .status{ color:var(--muted); font-size:15px; text-align:center;
    max-width:520px; margin:60px auto; line-height:1.6; }

  /* ---------- print ---------- */
  #printArea{ display:none; }
  @media print{
    html,body{ overflow:visible; height:auto; background:#fff; color:#000; }
    .toolbar,.viewer{ display:none !important; }
    #printArea{ display:block; }
    .print-page{ width:210mm; min-height:297mm; height:297mm; padding:14mm;
      display:flex; flex-direction:column; overflow:hidden;
      break-after:page; page-break-after:always; color:#000; }
    .print-page:last-child{ break-after:auto; page-break-after:auto; }
    .print-page .song-content{ flex:1 1 auto; overflow:hidden; }
    .print-page .line.chord{ color:#1d4ed8; }
  }
  @page{ size:A4; margin:0; }

  @media (max-width:560px){
    .song-title{ font-size:19px; }
    .toolbar{ padding:6px 8px; gap:6px; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="group grow">
    <button class="icon" id="prevBtn" title="Előző dal">‹</button>
    <select id="songSelect" aria-label="Dal választása"></select>
    <button class="icon" id="nextBtn" title="Következő dal">›</button>
  </div>

  <div class="sep"></div>
  <div class="group">
    <span class="label">Hang</span>
    <button id="keyDown" title="Fél hanggal lejjebb">−</button>
    <span class="key-val" id="keyVal">–</span>
    <button id="keyUp" title="Fél hanggal feljebb">+</button>
    <button id="keyReset" title="Eredeti hangnem">0</button>
  </div>

  <div class="sep"></div>
  <div class="group">
    <span class="label">Méret</span>
    <button id="fontDown" title="Kisebb betű">A−</button>
    <button id="fontUp" title="Nagyobb betű">A+</button>
  </div>

  <div class="sep"></div>
  <div class="group">
    <button class="icon" id="playBtn" title="Autoscroll indítása/leállítása">▶</button>
    <select id="speedSel" title="Görgetési sebesség">
      <option value="12">Lassú</option>
      <option value="26" selected>Közepes</option>
      <option value="45">Gyors</option>
      <option value="80">Nagyon gyors</option>
    </select>
  </div>

  <div class="sep"></div>
  <div class="group">
    <button class="icon" id="themeBtn" title="Világos / sötét téma">☀</button>
    <label class="icon" style="display:inline-flex;align-items:center;justify-content:center;" for="fileInput" title="MD fájl betöltése kézzel">📂</label>
    <input type="file" id="fileInput" accept=".md,.txt">
    <button class="icon" id="reloadBtn" title="Újratöltés a fájlból">⟳</button>
    <button class="icon" id="printBtn" title="Nyomtatás / PDF">🖨</button>
  </div>
</div>

<div class="viewer mode-flow" id="viewer">
  <div class="status" id="status">Betöltés…</div>
</div>

<div id="printArea"></div>

<script>
(function(){
  const MD_FILE = 'Moll könyv.md';

  // ---------- transpose ----------
  const SHARP_NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const ENHARMONIC = {Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#',Cb:'B','E#':'F','B#':'C',Fb:'E'};
  const CHORD_TOKEN_RE = /^[A-G](#|b)?(maj|min|m)?(6|7|9|11|13)?(sus2|sus4|sus)?(add\d{1,2})?(dim|aug)?(\/[A-G](#|b)?)?$/;

  function shiftNote(note, s){
    const norm = ENHARMONIC[note] || note;
    const idx = SHARP_NOTES.indexOf(norm);
    return idx === -1 ? note : SHARP_NOTES[((idx + s) % 12 + 12) % 12];
  }
  function transposeToken(token, s){
    const m = /^([A-G])(#|b)?/.exec(token);
    if(!m) return token;
    let rest = token.slice(m[0].length), bass = '';
    const si = rest.indexOf('/');
    if(si !== -1){
      const bp = rest.slice(si + 1); rest = rest.slice(0, si);
      const bm = /^([A-G])(#|b)?/.exec(bp);
      bass = bm ? '/' + shiftNote(bm[1] + (bm[2]||''), s) + bp.slice(bm[0].length) : '/' + bp;
    }
    return shiftNote(m[1] + (m[2]||''), s) + rest + bass;
  }
  function transposeLine(text, s){
    if(s === 0) return text;
    return text.split(/(\s+)/).map(c => /^\s*$/.test(c) ? c : (isChordToken(c) ? transposeToken(c, s) : c)).join('');
  }
  function isChordToken(t){ return CHORD_TOKEN_RE.test(t); }
  function isChordLine(text){
    const t = text.trim();
    if(t === '') return false;
    const toks = t.split(/\s+/).filter(x => !/^x\d+$/i.test(x) && !/^\(.*\)$/.test(x));
    return toks.length > 0 && toks.every(isChordToken);
  }

  // ---------- parsing ----------
  function parseSongbook(text){
    const lines = text.replace(/\r\n?/g, '\n').split('\n');
    const songs = []; let i = 0;
    const isTitle = l => /^#{1,6}\s+/.test(l);
    while(i < lines.length){
      if(isTitle(lines[i])){
        const title = lines[i].replace(/^#{1,6}\s+/, '').trim(); i++;
        while(i < lines.length && lines[i].trim() === '') i++;
        const body = [];
        if(i < lines.length && lines[i].trim().startsWith('```')){
          i++;
          while(i < lines.length && lines[i].trim() !== '```'){ body.push(lines[i]); i++; }
          if(i < lines.length) i++;
        } else {
          while(i < lines.length && !isTitle(lines[i])){ body.push(lines[i]); i++; }
        }
        songs.push(buildSong(title, body));
      } else i++;
    }
    return songs;
  }
  function buildSong(title, bodyLines){
    let idx = 0;
    while(idx < bodyLines.length && bodyLines[idx].trim() === '') idx++;
    let capo = null;
    if(idx < bodyLines.length && /^capo\b/i.test(bodyLines[idx].trim())){ capo = bodyLines[idx].trim(); idx++; }
    const rawBlocks = []; let cur = [];
    for(const l of bodyLines.slice(idx)){
      if(l.trim() === ''){ if(cur.length){ rawBlocks.push(cur); cur = []; } }
      else cur.push(l);
    }
    if(cur.length) rawBlocks.push(cur);
    const blocks = rawBlocks.map(rb => {
      let header = null, body = rb;
      const hm = /^\s*(\[[^\]]+\])\s*$/.exec(rb[0]);
      if(hm){ header = hm[1]; body = rb.slice(1); }
      return { header, lines: body.map(t => ({ type: isChordLine(t) ? 'chord' : 'lyric', text: t })) };
    });
    let baseRoot = null;
    outer: for(const b of blocks) for(const l of b.lines) if(l.type === 'chord'){
      const m = /^([A-G])(#|b)?/.exec(l.text.trim().split(/\s+/)[0]);
      if(m){ baseRoot = ENHARMONIC[m[1]+(m[2]||'')] || (m[1]+(m[2]||'')); break outer; }
    }
    return { title, capo, blocks, baseRoot, offset: 0 };
  }

  // ---------- line reflow (mobile) ----------
  // Wrap a chord line + lyric line pair to maxCols columns, breaking at
  // word boundaries so chords stay above the right words. Either side may
  // be empty (chord-only or lyric-only line).
  function wrapPair(C, L, maxCols){
    const len = Math.max(C.length, L.length);
    C = C.padEnd(len, ' '); L = L.padEnd(len, ' ');
    const out = []; let start = 0;
    while(start < len){
      if(len - start <= maxCols){ out.push([C.slice(start), L.slice(start)]); break; }
      let brk = -1;
      for(let i = start + 1; i <= start + maxCols && i < len; i++){
        if(L[i] === ' ' && C[i] === ' ') brk = i;
      }
      if(brk === -1) brk = start + maxCols;               // no safe space: hard break
      out.push([C.slice(start, brk).replace(/\s+$/,''), L.slice(start, brk).replace(/\s+$/,'')]);
      while(brk < len && L[brk] === ' ' && C[brk] === ' ') brk++; // drop shared leading spaces
      start = brk;
    }
    return out;
  }

  function addLine(inner, type, text){
    if(text.trim() === '' && type === 'chord') return;
    const d = document.createElement('div');
    d.className = 'line ' + type; d.textContent = text;
    inner.appendChild(d);
  }

  function buildFlowInner(song, maxCols){
    const inner = document.createElement('div');
    inner.className = 'song-inner';
    for(const block of song.blocks){
      const stanza = document.createElement('div');
      stanza.className = 'stanza';
      if(block.header){
        const h = document.createElement('div');
        h.className = 'section-header'; h.textContent = block.header;
        stanza.appendChild(h);
      }
      const ls = block.lines; let i = 0;
      while(i < ls.length){
        const cur = ls[i];
        if(cur.type === 'chord'){
          const cText = transposeLine(cur.text, song.offset);
          if(i + 1 < ls.length && ls[i+1].type === 'lyric'){
            wrapPair(cText, ls[i+1].text, maxCols).forEach(([c,l]) => {
              addLine(stanza, 'chord', c);
              if(l.trim() !== '') addLine(stanza, 'lyric', l);
            });
            i += 2;
          } else {
            wrapPair(cText, '', maxCols).forEach(([c]) => addLine(stanza, 'chord', c));
            i++;
          }
        } else {
          wrapPair('', cur.text, maxCols).forEach(([,l]) => {
            if(l.trim() !== '') addLine(stanza, 'lyric', l);
          });
          i++;
        }
      }
      inner.appendChild(stanza);
    }
    return inner;
  }

  // original (unwrapped) inner for A4 page + print
  function buildPageInner(song){
    const inner = document.createElement('div');
    inner.className = 'song-inner';
    for(const block of song.blocks){
      const stanza = document.createElement('div');
      stanza.className = 'stanza';
      if(block.header){
        const h = document.createElement('div');
        h.className = 'section-header'; h.textContent = block.header;
        stanza.appendChild(h);
      }
      for(const l of block.lines){
        const d = document.createElement('div');
        d.className = 'line ' + l.type;
        d.textContent = l.type === 'chord' ? transposeLine(l.text, song.offset) : l.text;
        stanza.appendChild(d);
      }
      inner.appendChild(stanza);
    }
    return inner;
  }

  // ---------- measuring ----------
  function songFontPx(){
    return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--song-font')) || 16;
  }
  function charWidthPx(fs){
    const s = document.createElement('span');
    s.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;'
      + 'font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:' + fs + 'px;';
    s.textContent = '0'.repeat(50);
    document.body.appendChild(s);
    const w = s.getBoundingClientRect().width / 50;
    s.remove();
    return w || fs * 0.6;
  }

  // ---------- state ----------
  const viewer   = document.getElementById('viewer');
  const statusEl = document.getElementById('status');
  const select   = document.getElementById('songSelect');
  const keyVal   = document.getElementById('keyVal');
  let songs = [], current = 0;

  const isPageMode = () => window.matchMedia('(min-width:760px)').matches;

  function renderCurrent(){
    stopScroll();
    const song = songs[current];
    viewer.className = 'viewer ' + (isPageMode() ? 'mode-page' : 'mode-flow');
    viewer.innerHTML = '';
    if(!song){ viewer.appendChild(statusEl); return; }

    keyVal.textContent = song.baseRoot
      ? shiftNote(song.baseRoot, song.offset) + (song.offset ? ` (${song.offset>0?'+':''}${song.offset})` : '')
      : '–';

    if(isPageMode()) layoutPage(song);
    else             layoutFlow(song);

    viewer.scrollTop = 0; scrollAccum = 0;
  }

  function headEl(song, cls){
    const head = document.createElement('div');
    head.className = cls;
    const t = document.createElement('h1'); t.className = 'song-title'; t.textContent = song.title;
    head.appendChild(t);
    if(song.capo){ const c = document.createElement('div'); c.className = 'song-capo'; c.textContent = song.capo; head.appendChild(c); }
    return head;
  }

  function layoutFlow(song){
    viewer.appendChild(headEl(song, 'song-head'));
    const fs = songFontPx();
    const avail = viewer.clientWidth - 24;
    const maxCols = Math.max(10, Math.floor(avail / charWidthPx(fs)));
    viewer.appendChild(buildFlowInner(song, maxCols));
  }

  function layoutPage(song){
    const wrap = document.createElement('div'); wrap.className = 'page-wrap';
    const page = document.createElement('div'); page.className = 'page';
    page.appendChild(headEl(song, 'page-title-row'));
    const content = document.createElement('div'); content.className = 'song-content';
    content.appendChild(buildPageInner(song));
    page.appendChild(content);
    wrap.appendChild(page); viewer.appendChild(wrap);
    requestAnimationFrame(() => { fitContent(page); fitPageToViewport(page, wrap); });
  }

  const COLUMN_GAP = 28;
  // Fit a whole song onto one A4 page. Columns are laid out at their natural
  // (unscaled) width so a line always fits its column, then the whole block is
  // uniformly scaled down to fit the page — up to 3 columns, whichever gives
  // the largest readable text.
  function fitContent(page){
    const content = page.querySelector('.song-content');
    const inner = page.querySelector('.song-inner');
    const availW = content.clientWidth, availH = content.clientHeight;
    if(availW <= 0 || availH <= 0) return;
    inner.style.transform = 'none'; inner.style.columnCount = 1;
    inner.style.columnGap = '0'; inner.style.width = 'max-content';
    const lineMaxW = Math.max(inner.scrollWidth, 1);   // widest single line
    const natH = Math.max(inner.scrollHeight, 1);      // total height, 1 column
    let tallest = 1;                                   // tallest unsplittable stanza
    inner.querySelectorAll('.stanza').forEach(s => { tallest = Math.max(tallest, s.offsetHeight); });

    let best = { k: 0, cols: 1, W: lineMaxW };
    for(const cols of [1,2,3]){
      const gap = cols > 1 ? COLUMN_GAP * (cols - 1) : 0;
      const Wun = lineMaxW * cols + gap;               // unscaled width needed
      const Hun = Math.max(natH / cols, tallest);      // unscaled column height needed
      const k = Math.min(1, availW / Wun, availH / Hun);
      if(k > best.k + 1e-4) best = { k, cols, W: Wun };
    }
    inner.style.columnCount = best.cols;
    inner.style.columnGap = best.cols > 1 ? COLUMN_GAP + 'px' : '0';
    inner.style.width = best.W + 'px';
    inner.style.transform = `scale(${best.k})`;
  }
  function fitPageToViewport(page, wrap){
    const pw = page.offsetWidth, ph = page.offsetHeight;
    const availW = viewer.clientWidth - 36, availH = viewer.clientHeight - 36;
    const s = Math.min(1, availW / pw, availH / ph);
    page.style.transform = `scale(${s})`;
    wrap.style.width = pw * s + 'px';
    wrap.style.height = ph * s + 'px';
  }

  function goto(idx){
    if(!songs.length) return;
    current = (idx % songs.length + songs.length) % songs.length;
    select.value = String(current);
    renderCurrent();
  }

  // ---------- autoscroll ----------
  const speedSel = document.getElementById('speedSel');
  const playBtn = document.getElementById('playBtn');
  let scrolling = false, rafId = null, lastT = 0, scrollAccum = 0;
  const pxPerSec = () => Number(speedSel.value) || 26;
  function tick(t){
    if(!scrolling) return;
    if(lastT){
      scrollAccum += pxPerSec() * Math.min(t - lastT, 100) / 1000;
      viewer.scrollTop = scrollAccum;
      if(viewer.scrollTop + viewer.clientHeight >= viewer.scrollHeight - 1){ stopScroll(); return; }
    }
    lastT = t; rafId = requestAnimationFrame(tick);
  }
  function startScroll(){
    if(scrolling || !songs.length) return;
    scrolling = true; lastT = 0; scrollAccum = viewer.scrollTop;
    playBtn.textContent = '⏸'; rafId = requestAnimationFrame(tick);
  }
  function stopScroll(){ scrolling = false; if(rafId) cancelAnimationFrame(rafId); playBtn.textContent = '▶'; }
  function toggleScroll(){ scrolling ? stopScroll() : startScroll(); }
  viewer.addEventListener('scroll', () => { if(!scrolling) scrollAccum = viewer.scrollTop; });

  // ---------- loading ----------
  function loadText(text){
    songs = parseSongbook(text);
    select.innerHTML = '';
    songs.forEach((s, i) => { const o = document.createElement('option'); o.value = String(i); o.textContent = s.title; select.appendChild(o); });
    if(!songs.length){
      statusEl.textContent = 'Nem található dal a fájlban. Formátum: „# Cím”, alatta a dalszöveg akkordokkal.';
      viewer.innerHTML = ''; viewer.appendChild(statusEl); return;
    }
    goto(0);
  }
  function fetchMd(){
    statusEl.textContent = 'Betöltés…';
    if(!viewer.contains(statusEl)){ viewer.innerHTML=''; viewer.appendChild(statusEl); }
    fetch(encodeURI(MD_FILE) + '?t=' + Date.now())
      .then(r => { if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(loadText)
      .catch(() => {
        statusEl.textContent = 'A(z) "' + MD_FILE + '" nem tölthető be automatikusan. '
          + 'Ha helyben (file://) nyitod meg, használd a 📂 gombot. GitHub Pages-en automatikus.';
        viewer.innerHTML = ''; viewer.appendChild(statusEl);
      });
  }

  // ---------- print ----------
  function buildPrint(){
    const area = document.getElementById('printArea');
    area.innerHTML = '';
    songs.forEach(song => {
      const pg = document.createElement('div'); pg.className = 'print-page';
      const h = document.createElement('h1'); h.className = 'song-title';
      h.textContent = song.title + (song.capo ? '  —  ' + song.capo : '');
      pg.appendChild(h);
      const content = document.createElement('div'); content.className = 'song-content';
      content.appendChild(buildPageInner(song));
      pg.appendChild(content);
      area.appendChild(pg);
      fitContent(pg);
    });
  }

  // ---------- theme ----------
  const themeBtn = document.getElementById('themeBtn');
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'light' ? '🌙' : '☀';
    try{ localStorage.setItem('moll-theme', t); }catch(e){}
  }
  (function initTheme(){
    let t = 'dark';
    try{ t = localStorage.getItem('moll-theme') || 'dark'; }catch(e){}
    applyTheme(t);
  })();
  themeBtn.onclick = () => applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');

  // ---------- wiring ----------
  document.getElementById('prevBtn').onclick = () => goto(current - 1);
  document.getElementById('nextBtn').onclick = () => goto(current + 1);
  select.onchange = () => goto(Number(select.value));
  document.getElementById('keyDown').onclick  = () => { const s=songs[current]; if(s){ s.offset--; renderCurrent(); } };
  document.getElementById('keyUp').onclick    = () => { const s=songs[current]; if(s){ s.offset++; renderCurrent(); } };
  document.getElementById('keyReset').onclick = () => { const s=songs[current]; if(s){ s.offset=0; renderCurrent(); } };

  function changeFont(delta){
    const root = document.documentElement;
    const cur = songFontPx();
    root.style.setProperty('--song-font', Math.min(30, Math.max(10, cur + delta)) + 'px');
    renderCurrent();
  }
  document.getElementById('fontUp').onclick   = () => changeFont(1);
  document.getElementById('fontDown').onclick = () => changeFont(-1);

  playBtn.onclick = toggleScroll;
  document.getElementById('reloadBtn').onclick = fetchMd;
  document.getElementById('printBtn').onclick = () => { buildPrint(); window.print(); };
  document.getElementById('fileInput').addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader(); r.onload = () => loadText(r.result); r.readAsText(f, 'utf-8');
  });

  document.addEventListener('keydown', e => {
    if(e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if(e.key === 'ArrowRight') goto(current + 1);
    else if(e.key === 'ArrowLeft') goto(current - 1);
    else if(e.key === ' '){ e.preventDefault(); toggleScroll(); }
  });

  // swipe left/right to change song
  let tx = null, ty = null;
  viewer.addEventListener('touchstart', e => { if(e.touches.length === 1){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; } }, {passive:true});
  viewer.addEventListener('touchend', e => {
    if(tx === null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) goto(current + (dx < 0 ? 1 : -1));
    tx = ty = null;
  }, {passive:true});

  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderCurrent, 150); });

  fetchMd();
})();
</script>
</body>
</html>
